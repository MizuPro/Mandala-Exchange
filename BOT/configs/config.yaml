bei:
  base_url: "http://localhost:4100"
  service_token: "dev-bot-service-token-change-me-2026"
  poll_interval: "30s"

mats:
  ws_url: "ws://localhost:8082/v1/market-data/ws"
  service_token: "dev-bot-service-token-change-me-2026"
  symbols:
    - "MNDL"
    - "NUSA"
    - "BARA"

sekuritas:
  base_url: "http://localhost:3002"
  service_token: "dev-bot-service-token-change-me-2026"

queue:
  buffer_size: 500
  ttl: "30s"

executor:
  orders_per_minute: 120

scheduler:
  scan_interval: "1s"
  seed: 20260704
  intervals:
    noise_trader:
      min_seconds: 30
      max_seconds: 90
    momentum_trader:
      min_seconds: 10
      max_seconds: 30
    contrarian:
      min_seconds: 30
      max_seconds: 90
    event_driven:
      min_seconds: 5
      max_seconds: 15
    market_maker:
      min_seconds: 10
      max_seconds: 25
    value_investor:
      min_seconds: 30
      max_seconds: 90
    index_tracker:
      min_seconds: 20
      max_seconds: 60
    bandar:
      min_seconds: 15
      max_seconds: 45

admin:
  port: 4200

population:
  enabled: true
  size: 500
  seed: 20260704
  composition:
    noise_trader: 160
    momentum_trader: 90
    contrarian: 70
    event_driven: 60
    market_maker: 40
    value_investor: 40
    index_tracker: 20
    bandar: 20

strategy:
  noise_trader:
    inactive_rate: 0.15          # 15% chance bot skip satu sesi (tidak order)
    max_orders_per_session: 20   # max order per bot per sesi
    max_lots_per_order: 50       # max lot per single order
    price_noise_pct: 0.02        # noise harga +/- 2% dari last_price
    opening_auction_rate: 0.15   # 15% bot aktif di opening auction
    closing_auction_rate: 0.08   # 8% bot aktif di closing auction
    continuous_tick_interval_min: 30  # min interval evaluasi di continuous (detik)
    continuous_tick_interval_max: 90  # max interval evaluasi di continuous (detik)
  momentum_trader:
    inactive_rate: 0.10
    max_orders_per_session: 30
    max_lots_per_order: 100
    spread_threshold_pct: 0.05
    imbalance_threshold: 0.10
    return_threshold: 0.005
    fair_value_brake_multiplier: 1.5
    opening_auction_rate: 0.20
    closing_auction_rate: 0.10
    continuous_tick_interval_min: 10
    continuous_tick_interval_max: 30
  contrarian:
    inactive_rate: 0.15
    max_orders_per_session: 20
    max_lots_per_order: 80
    discount_threshold: 0.10
    premium_threshold: 0.10
    reference_deviation_threshold: 0.05
    opening_auction_rate: 0.10
    closing_auction_rate: 0.05
    continuous_tick_interval_min: 30
    continuous_tick_interval_max: 90
  event_driven:
    inactive_rate: 0.05
    max_orders_per_session: 30
    max_lots_per_order: 150
    opening_auction_rate: 0.30
    closing_auction_rate: 0.15
    continuous_tick_interval_min: 5
    continuous_tick_interval_max: 15
  market_maker:
    inactive_rate: 0.05
    max_orders_per_session: 60
    max_lots_per_order: 100
    base_spread_ticks: 3
    max_inventory_shares: 5000
    opening_auction_rate: 0.50
    closing_auction_rate: 0.30
    continuous_tick_interval_min: 10
    continuous_tick_interval_max: 25
  value_investor:
    inactive_rate: 0.40
    max_orders_per_session: 10
    max_lots_per_order: 50
    discount_threshold: 0.15
    premium_threshold: 0.15
    opening_auction_rate: 0.20
    closing_auction_rate: 0.10
    continuous_tick_interval_min: 30
    continuous_tick_interval_max: 90
  index_tracker:
    inactive_rate: 0.10
    max_orders_per_session: 10
    max_lots_per_order: 80
    opening_auction_rate: 0.0
    closing_auction_rate: 0.80
    continuous_tick_interval_min: 20
    continuous_tick_interval_max: 60
  bandar:
    inactive_rate: 0.20
    max_orders_per_session: 20
    max_lots_per_order: 500
    fair_value_brake_multiplier: 1.5
    brake_discount: 0.50
    opening_auction_rate: 0.40
    closing_auction_rate: 0.20
    continuous_tick_interval_min: 15
    continuous_tick_interval_max: 45

